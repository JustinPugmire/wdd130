<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The Battle Is The Lord's</td>
            <td>BYUi</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder David A. and Sister Susan K. Bednar</td>
            <td>BYUi 25th Anniversary Devotional</td>
            <td>BYUi</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>President Alvin F. Meredith III</td>
            <td>The Mission of BYU-Idaho</td>
            <td>BYUi</td>
            <td>2026</td>
          </tr>
        </table>
        <form>
          <label for="sname">Speaker Name:</label>
          <input type="text" id="sname" name="sname">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title">
          <label for="location">Location:</label>
          <input type="text" id="location" name="location">
          <label for="year">Year:</label>
          <input type="text" id="year" name="year">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
