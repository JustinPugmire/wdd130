<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            background-color: white;
            margin: 0 auto;
            width: 600px;
            margin-top: 20px;
            border: 15px solid darkblue;
            border-radius: 15px;
        }

        #titleContainer {
            color: white;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            font-size: 30px;
            text-shadow: 0px 3px 4px black;
        }

        #title {
            padding: 125px 0px 0px 0px;
            text-align: center;
        }

        h3 {
            padding-top: 30px;
            padding-bottom: 15px;
            text-align: center;
            font-size: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 50% 50%;
            align-items: center;
            font-size: 25px;
        }

        label {
            grid-column: 1/2;
            padding: 20px 10px 20px 10px;
        }

        input {
            grid-column: 2/3;
            margin-right: 10px;
            font-size: 25px;
        }

        #newsletterBox {
            grid-column: 1/3;
            text-align: center;
            padding: 10px 0px 10px 0px;
        }

        #conditionsBox {
            grid-column: 1/3;
            text-align: center;
            padding: 10px 0px 20px 0px;
        }

        #submitButton {
            grid-column: 1/3;
            text-align: center;
            padding-bottom: 20px;
            font-size: 25px;
        }

        #closeBtn {
            margin-left: 10px;
            font-size: 20px;
            padding-left: 10px;
            padding-right: 10px;
        }

        #images {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            column-gap: 10px;
            place-items: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    </style>




</head>

<body>
    <div id="formContainer">
        <div id="titleContainer">
            <button type="button" id="closeBtn">X</button>
            <div id="title">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>\
            </div>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section id="newsletterBox">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section id="conditionsBox">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section id="submitButton">
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="images">
            <img src="images/old_testament.webp" alt="Old Testament Cover">
            <img src="images/new_testament.webp" alt="New Testament Cover">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon Cover">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants Cover">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price Cover">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
